<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Saymodz CHAT</title>
<style>
:root {
    --bg-dark: #0f1115;
    --bg-panel: #1a1d24;
    --bg-card: #23262f;
    --bg-hover: #2a2e3a;
    --border: #2e323d;
    --border-soft: #3a3f4d;
    --accent: #5c7cfa;
    --accent-soft: #7b8fff;
    --accent-glow: rgba(92,124,250,0.3);
    --text: #e8eaf0;
    --text-sub: #8a8f9c;
    --text-muted: #5a5f6b;
    --danger: #f75b5b;
    --success: #4ade80;
    --warning: #fbbf24;
    --admin: #fbbf24;
}

/* TEMA RENKLERİ */
body[data-theme="purple"] { --accent: #a855f7; --accent-soft: #c084fc; --accent-glow: rgba(168,85,247,0.3); }
body[data-theme="green"] { --accent: #22c55e; --accent-soft: #4ade80; --accent-glow: rgba(34,197,94,0.3); }
body[data-theme="red"] { --accent: #ef4444; --accent-soft: #f87171; --accent-glow: rgba(239,68,68,0.3); }
body[data-theme="orange"] { --accent: #f97316; --accent-soft: #fb923c; --accent-glow: rgba(249,115,22,0.3); }
body[data-theme="pink"] { --accent: #ec4899; --accent-soft: #f472b6; --accent-glow: rgba(236,72,153,0.3); }
body[data-theme="cyan"] { --accent: #06b6d4; --accent-soft: #22d3ee; --accent-glow: rgba(6,182,212,0.3); }

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    font-size: 11px;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-dark);
    color: var(--text);
}

/* ===== AUTH EKRANI (KÜÇÜLTÜLMÜŞ) ===== */
.auth-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: linear-gradient(135deg, #0f1115 0%, #1a1d24 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 12px;
}

.auth-box {
    width: 100%;
    max-width: 220px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 25px var(--accent-glow);
    animation: slideUp 0.4s ease;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.auth-logo {
    text-align: center;
    font-size: 17px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-soft));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 2px;
    letter-spacing: -0.4px;
}

.auth-sub {
    text-align: center;
    font-size: 9px;
    color: var(--text-sub);
    margin-bottom: 12px;
}

.auth-box .inp {
    width: 100%;
    padding: 7px 9px;
    background: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    margin-bottom: 6px;
    outline: none;
    font-size: 10px;
    transition: 0.2s;
}

.auth-box .inp:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
}

.auth-box .btn {
    width: 100%;
    padding: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-soft));
    border: none;
    border-radius: 7px;
    color: #fff;
    font-weight: 700;
    font-size: 10px;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 3px 10px var(--accent-glow);
}

.auth-box .btn:active { transform: scale(0.98); }
.auth-box .btn:disabled { opacity: 0.5; cursor: not-allowed; }

.toggle-auth {
    margin-top: 9px;
    text-align: center;
    font-size: 9px;
    color: var(--text-sub);
    cursor: pointer;
}
.toggle-auth span { color: var(--accent); font-weight: 600; }

.error-msg {
    background: rgba(247,91,91,0.15);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 9px;
    margin-bottom: 7px;
    display: none;
}
.error-msg.show { display: block; }

/* ===== APP ===== */
#app { display: none; width: 100vw; height: 100vh; background: var(--bg-dark); }
#app.active { display: flex; }

/* SIDEBAR */
.sidebar {
    width: 48px;
    height: 100vh;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0;
    gap: 6px;
    flex-shrink: 0;
    z-index: 10;
}

.side-item {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-sub);
    transition: 0.2s;
    position: relative;
}

.side-item:active { transform: scale(0.92); }

.side-item.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent-soft);
    box-shadow: 0 3px 10px var(--accent-glow);
}

.badge {
    position: absolute;
    top: 1px;
    right: 1px;
    min-width: 14px;
    height: 14px;
    background: var(--danger);
    color: #fff;
    font-size: 8px;
    font-weight: 700;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 3px;
    border: 1.5px solid var(--bg-panel);
}

/* MAIN */
.main-container { flex: 1; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
    height: 44px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    flex-shrink: 0;
}

.topbar-info { display: flex; flex-direction: column; overflow: hidden; }
.topbar-title { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.topbar-sub { font-size: 9px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-btns { display: flex; gap: 5px; }

.icon-btn {
    width: 30px;
    height: 30px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-sub);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.icon-btn:active { transform: scale(0.92); }

/* CONTENT */
.content { flex: 1; overflow: hidden; position: relative; background: var(--bg-dark); }
.panel { display: none; width: 100%; height: 100%; flex-direction: column; }
.panel.active { display: flex; }

/* CHAT */
.chat-body {
    flex: 1;
    padding: 8px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
}

.chat-body::-webkit-scrollbar { width: 3px; }
.chat-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 30px 15px;
    font-size: 11px;
}

/* MESAJ BALONU - KÜÇÜK */
.msg-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 8px;
    max-width: 72%;
    align-self: flex-start;
    animation: fadeIn 0.2s ease;
    position: relative;
    font-size: 11px;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}

.msg-box.self {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(92,124,250,0.25), rgba(92,124,250,0.15));
    border-color: var(--accent);
}

.msg-box.admin-msg {
    border-color: var(--admin);
    box-shadow: 0 0 10px rgba(251,191,36,0.25);
    background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(251,191,36,0.05));
}

.msg-head {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 9px;
    margin-bottom: 2px;
}

.msg-user {
    font-weight: 700;
    color: var(--accent-soft);
    cursor: pointer;
}

.msg-user:hover { text-decoration: underline; }

.msg-user.admin {
    color: var(--admin);
    display: flex;
    align-items: center;
    gap: 2px;
    animation: adminGlow 2s ease-in-out infinite;
}

@keyframes adminGlow {
    0%, 100% { filter: drop-shadow(0 0 2px var(--admin)); }
    50% { filter: drop-shadow(0 0 6px var(--admin)); }
}

.admin-crown { font-size: 10px; }
.msg-time { color: var(--text-muted); margin-left: auto; font-size: 8px; }
.msg-text { font-size: 11px; word-break: break-word; line-height: 1.35; color: var(--text); }

.msg-actions {
    display: none;
    position: absolute;
    top: -6px;
    right: 5px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px;
    gap: 1px;
}

.msg-box:hover .msg-actions { display: flex; }

.msg-action {
    background: none;
    border: none;
    color: var(--text-sub);
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 4px;
    font-size: 10px;
}

.msg-action:hover { background: var(--bg-hover); color: var(--danger); }

/* INPUT BAR */
.input-bar {
    padding: 6px 8px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 5px;
    align-items: center;
    flex-shrink: 0;
}

.input-bar .inp {
    margin: 0;
    padding: 7px 11px;
    border-radius: 18px;
    font-size: 11px;
}

.send-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-soft));
    border: none;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 3px 10px var(--accent-glow);
    transition: 0.2s;
}

.send-btn:active { transform: scale(0.92); }

/* LİSTE */
.list-header {
    padding: 8px 10px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 5px;
    flex-shrink: 0;
}

.list-header .inp {
    margin: 0;
    padding: 6px 10px;
    font-size: 10px;
}

.list-header .btn {
    width: auto;
    padding: 6px 12px;
    font-size: 10px;
    white-space: nowrap;
    box-shadow: none;
}

.list-area {
    flex: 1;
    padding: 8px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.list-area::-webkit-scrollbar { width: 3px; }
.list-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.row-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-card);
    padding: 7px 10px;
    border-radius: 9px;
    border: 1px solid var(--border);
    font-size: 11px;
    transition: 0.2s;
}

.row-item:hover { background: var(--bg-hover); border-color: var(--border-soft); }

.row-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-soft));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #fff;
    font-size: 11px;
    flex-shrink: 0;
    margin-right: 8px;
    cursor: pointer;
}

.row-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    cursor: pointer;
}

.row-name { font-weight: 600; color: var(--text); font-size: 11px; }
.row-sub { font-size: 9px; color: var(--text-sub); }
.row-actions { display: flex; gap: 4px; }

.mini-btn {
    padding: 4px 9px;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 9px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.mini-btn:active { transform: scale(0.95); }
.mini-btn.danger { background: var(--danger); }
.mini-btn.success { background: var(--success); color: #000; }
.mini-btn.warning { background: var(--warning); color: #000; }

/* MODAL */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 12px;
}

.modal.active { display: flex; animation: fadeIn 0.2s; }

.modal-box {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 340px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

.modal-head {
    padding: 12px 14px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
    border-radius: 14px 14px 0 0;
}

.modal-close {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
}

.modal-body {
    flex: 1;
    padding: 12px 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
}

.setting-row:last-child { border-bottom: none; }
.setting-label { color: var(--text-sub); }
.setting-value { color: var(--text); font-weight: 600; }

/* TOAST */
.toast {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    z-index: 10000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: 0.3s;
    opacity: 0;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
}

.toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
}

.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }
.toast.warning { border-color: var(--warning); }

/* LOADING */
.loading {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    color: var(--text-muted);
    gap: 7px;
    font-size: 11px;
}

.spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* PROFİL */
.profile-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
}

.profile-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-soft));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #fff;
    font-size: 20px;
    margin-bottom: 7px;
}

.profile-name { font-size: 14px; font-weight: 700; color: var(--text); }
.profile-role { font-size: 10px; margin-top: 2px; }
.profile-role.admin { color: var(--admin); font-weight: 700; }
.profile-info { display: flex; flex-direction: column; gap: 5px; padding-top: 8px; }
.profile-info-row { display: flex; justify-content: space-between; font-size: 11px; }

/* TEMA SEÇİCİ */
.theme-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 6px;
}

.theme-dot {
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: 0.2s;
}

.theme-dot:hover { transform: scale(1.05); }
.theme-dot.active { border-color: #fff; }

/* ADMIN PANEL */
.admin-panel {
    background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(251,191,36,0.03));
    border: 1px solid var(--admin);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 8px;
}

.admin-panel-title {
    color: var(--admin);
    font-weight: 700;
    font-size: 11px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
}

/* MODAL BUTONLARI */
.modal-body .btn {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-weight: 700;
    font-size: 11px;
    cursor: pointer;
    transition: 0.2s;
}

.modal-body .btn:active { transform: scale(0.98); }

.modal-body .inp {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    outline: none;
    font-size: 11px;
}

.modal-body .inp:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
}

</style>
</head>
<body>

<!-- AUTH EKRANI -->
<div id="authScreen" class="auth-overlay">
    <div class="auth-box">
        <div class="auth-logo">Saymodz CHAT</div>
        <div class="auth-sub" id="authSub">Giriş Yap</div>
        <div id="errorBox" class="error-msg"></div>
        <input type="text" id="authU" class="inp" placeholder="Kullanıcı Adı" autocomplete="username">
        <input type="password" id="authP" class="inp" placeholder="Şifre" autocomplete="current-password">
        <button class="btn" id="authBtn" onclick="handleAuth()">Giriş Yap</button>
        <div class="toggle-auth" onclick="toggleAuthMode()">
            <span id="toggleTxt">Hesabın yok mu? <b>Kayıt Ol</b></span>
        </div>
    </div>
</div>

<!-- APP -->
<div id="app">
    <div class="sidebar">
        <div class="side-item active" data-tab="chat" onclick="switchTab('chat', this)" title="Sohbet">💬</div>
        <div class="side-item" data-tab="channels" onclick="switchTab('channels', this)" title="Kanallar">📢</div>
        <div class="side-item" data-tab="friends" onclick="switchTab('friends', this)" title="Kişiler">
            👥
            <div class="badge" id="friendBadge" style="display:none;">0</div>
        </div>
        <div class="side-item" data-tab="dms" onclick="switchTab('dms', this)" title="Mesajlar">✉️</div>
    </div>

    <div class="main-container">
        <div class="topbar">
            <div class="topbar-info">
                <div class="topbar-title" id="panelTitle">#genel</div>
                <div class="topbar-sub" id="panelSub">Sohbet kanalı</div>
            </div>
            <div class="topbar-btns">
                <button class="icon-btn" onclick="openModal('settingsModal')">⚙️</button>
            </div>
        </div>

        <div class="content">
            <div id="chatPanel" class="panel active">
                <div class="chat-body" id="messagesList">
                    <div class="loading"><div class="spinner"></div>Yükleniyor...</div>
                </div>
                <div class="input-bar">
                    <input type="text" id="chatInput" class="inp" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter') sendMsg()">
                    <button class="send-btn" onclick="sendMsg()" id="sendBtn">➤</button>
                </div>
            </div>

            <div id="channelsPanel" class="panel">
                <div class="list-header">
                    <input type="text" id="newChInp" class="inp" placeholder="Yeni kanal (örn: oyun)">
                    <button class="btn" onclick="addChannel()">+ Ekle</button>
                </div>
                <div class="list-area" id="channelsList"></div>
            </div>

            <div id="friendsPanel" class="panel">
                <div class="list-header">
                    <input type="text" id="friendInp" class="inp" placeholder="Kullanıcı adı">
                    <button class="btn" onclick="addFriend()">+ Ekle</button>
                </div>
                <div class="list-area" id="friendsList"></div>
            </div>

            <div id="dmsPanel" class="panel">
                <div class="list-area" id="dmsList"></div>
            </div>
        </div>
    </div>
</div>

<!-- AYARLAR MODALI -->
<div id="settingsModal" class="modal">
    <div class="modal-box">
        <div class="modal-head">
            <span>⚙️ Ayarlar</span>
            <button class="modal-close" onclick="closeModal('settingsModal')">✕</button>
        </div>
        <div class="modal-body">
            <div class="setting-row"><span class="setting-label">Kullanıcı Adı</span><span class="setting-value" id="settingsUser">-</span></div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, push, onValue, set, remove, get, update }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDrr7d_enIeE1pOk-Ov_23TpwKEpDrHRdw",
    authDomain: "saymodz-2d1ed.firebaseapp.com",
    databaseURL: "https://saymodz-2d1ed-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "saymodz-2d1ed",
    storageBucket: "saymodz-2d1ed.firebasestorage.app",
    messagingSenderId: "203228147622",
    appId: "1:203228147622:web:fb9101596485d2d3596967"
};

const ADMIN_USERNAME = "Saymodz";
const DEFAULT_ADMIN_PASS = "Saymodz@410";
const ADMIN_EMAIL = "saymodz410@saymodz.chat";

const BAD_WORDS = ["amk","aq","orospu","oç","oc","siktir","sikeyim","sik","yarrak","yarak","pic","piç","göt","got","amcık","amcik","pezevenk","kaltak","fahişe","fahise","şerefsiz","serefsiz","hıyar","hiyar","yavşak","yavsak","gerizekalı","gerizekali","salak","aptal","angut","dangalak","sikik","sikerim","sikecem","sokuk","yarram"];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let currentUsername = null;
let isAdmin = false;
let adminPassword = DEFAULT_ADMIN_PASS;
let currentChannel = 'genel';
let dmTarget = null;
let isRegister = false;
let allUsers = [];
let myFriends = [];
let allChannels = [];
let mutedUsers = {};
let bannedUsers = {};
let unsubscribeMessages = null;
let unsubscribeChannels = null;
let unsubscribeFriends = null;
let unsubscribeUsers = null;
let unsubscribeDMs = null;
let unsubscribeMuted = null;
let unsubscribeSettings = null;
let muteTarget = null;

function userToEmail(username) {
    return username.toLowerCase().replace(/[^a-z0-9]/g, '') + "@saymodz.chat";
}

function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast ' + type, 2500);
}

function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = msg;
    box.classList.add('show');
    setTimeout(() => box.classList.remove('show'), 4000);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function getInitials(name) {
    if (!name) return '?';
    return name.substring(0, 2).toUpperCase();
}

function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return 'şimdi';
    if (diff < 3600000) return Math.floor(diff/60000) + ' dk';
    if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    return d.toLocaleDateString([], { day: '2-digit', month: '2-digit' });
}

function containsBadWord(text) {
    if (!text) return false;
    const lower = text.toLowerCase()
        .replace(/[.,!?;:*_\-]/g, '')
        .replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
    for (const w of BAD_WORDS) { if (lower.includes(w)) return true; }
    return false;
}

function isMuted(username) {
    const m = mutedUsers[username];
    if (!m) return false;
    if (m.until && m.until > Date.now()) return true;
    if (m.until && m.until <= Date.now()) { remove(ref(db, 'muted/' + username)); return false; }
    return true;
}

function isBanned(username) {
    const b = bannedUsers[username];
    if (!b) return false;
    if (b.until && b.until > Date.now()) return true;
    if (b.until && b.until <= Date.now()) { remove(ref(db, 'banned/' + username)); return false; }
    return true;
}

window.toggleAuthMode = function() {
    isRegister = !isRegister;
    document.getElementById('authSub').innerText = isRegister ? "Kayıt Ol" : "Giriş Yap";
    document.getElementById('authBtn').innerText = isRegister ? "Kayıt Ol" : "Giriş Yap";
    document.getElementById('toggleTxt').innerHTML = isRegister
        ? "Hesabın var mı? <b>Giriş Yap</b>"
        : "Hesabın yok mu? <b>Kayıt Ol</b>";
};

window.handleAuth = async function() {
    const u = document.getElementById('authU').value.trim();
    const p = document.getElementById('authP').value;
    if (!u || !p) return showError("Kullanıcı adı ve şifre gerekli!");
    if (p.length < 6) return showError("Şifre en az 6 karakter olmalı!");
    if (!/^[a-zA-Z0-9_]+$/.test(u)) return showError("Kullanıcı adı sadece harf, rakam ve _ içerebilir!");
    if (containsBadWord(u)) return showError("Bu kullanıcı adı uygun değil!");

    const btn = document.getElementById('authBtn');
    btn.disabled = true;
    btn.innerText = "İşleniyor...";

    try {
        const email = userToEmail(u);

        if (isRegister) {
            if (u.toLowerCase() === ADMIN_USERNAME.toLowerCase()) {
                return showError("Bu kullanıcı adı kullanılamaz!");
            }
            const userCred = await createUserWithEmailAndPassword(auth, email, p);
            await updateProfile(userCred.user, { displayName: u });
            await set(ref(db, 'users/' + userCred.user.uid), {
                username: u, email: email, role: 'user', createdAt: Date.now()
            });
            showToast("✅ Kayıt başarılı! Hoş geldin " + u, 'success');
            isRegister = false;
            toggleAuthMode();
        } else {
            if (isBanned(u)) {
                const b = bannedUsers[u];
                const kalan = Math.ceil((b.until - Date.now()) / 60000);
                return showError(`🚫 Bu hesap banlı! Kalan: ${kalan} dk. Sebep: ${b.reason || 'Belirtilmedi'}`);
            }
            await signInWithEmailAndPassword(auth, email, p);
        }
    } catch (err) {
        console.error(err);
        let msg = "Hata: ";
        switch (err.code) {
            case 'auth/user-not-found':
            case 'auth/invalid-credential': msg = "Kullanıcı adı veya şifre hatalı!"; break;
            case 'auth/wrong-password': msg = "Şifre hatalı!"; break;
            case 'auth/email-already-in-use': msg = "Bu kullanıcı adı zaten alınmış!"; break;
            case 'auth/weak-password': msg = "Şifre çok zayıf!"; break;
            case 'auth/invalid-email': msg = "Kullanıcı adı geçersiz!"; break;
            case 'auth/too-many-requests': msg = "Çok fazla deneme! Bekleyin."; break;
            case 'auth/network-request-failed': msg = "İnternet yok!"; break;
            case 'auth/unauthorized-domain': msg = "Bu domain yetkili değil! Firebase'de ekleyin."; break;
            default: msg = "Hata: " + (err.message || 'Bilinmeyen hata');
        }
        showError(msg);
    } finally {
        btn.disabled = false;
        btn.innerText = isRegister ? "Kayıt Ol" : "Giriş Yap";
    }
};

window.logout = async function() {
    if (!confirm("Oturumu kapatmak istediğine emin misin?")) return;
    try { await signOut(auth); location.reload(); } catch (err) { showToast("Çıkış hatası!", 'error'); }
};

window.adminLogin = function() {
    const pass = document.getElementById('adminPassInp').value;
    if (!pass) return showToast("Şifre gir!", 'error');
    if (pass === adminPassword) {
        isAdmin = true;
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('adminLoginArea').style.display = 'none';
        document.getElementById('settingsRole').innerText = '👑 Admin';
        document.getElementById('settingsRole').style.color = 'var(--admin)';
        showToast("✅ Admin olarak giriş yapıldı!", 'success');
        if (currentUser) update(ref(db, 'users/' + currentUser.uid), { role: 'admin' });
    } else {
        showToast("❌ Yanlış şifre!", 'error');
    }
};

window.changeAdminPass = async function() {
    const newPass = document.getElementById('newAdminPass').value;
    if (!newPass || newPass.length < 6) return showToast("Şifre en az 6 karakter!", 'error');
    try {
        await set(ref(db, 'settings/adminPassword'), newPass);
        adminPassword = newPass;
        document.getElementById('newAdminPass').value = '';
        showToast("✅ Admin şifresi güncellendi!", 'success');
    } catch (e) { showToast("Hata: " + e.message, 'error'); }
};

onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUser = user;
        try {
            const snap = await get(ref(db, 'users/' + user.uid));
            if (snap.exists()) {
                const data = snap.val();
                currentUsername = data.username || user.displayName || 'Kullanıcı';
                isAdmin = data.role === 'admin' || data.username === ADMIN_USERNAME;
            } else {
                currentUsername = user.displayName || user.email.split('@')[0];
                isAdmin = currentUsername === ADMIN_USERNAME;
                await set(ref(db, 'users/' + user.uid), {
                    username: currentUsername, email: user.email,
                    role: isAdmin ? 'admin' : 'user', createdAt: Date.now()
                });
            }
        } catch (e) { currentUsername = user.displayName || 'Kullanıcı'; }

        if (isBanned(currentUsername)) {
            showToast("🚫 Hesabınız banlı!", 'error');
            await signOut(auth);
            return;
        }

        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('app').classList.add('active');
        document.getElementById('settingsUser').innerText = currentUsername;
        document.getElementById('settingsRole').innerText = isAdmin ? '👑 Admin' : 'Kullanıcı';
        document.getElementById('settingsRole').style.color = isAdmin ? 'var(--admin)' : 'var(--text)';

        if (isAdmin) {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('adminLoginArea').style.display = 'none';
        }
        startApp();
    } else {
        currentUser = null; currentUsername = null; isAdmin = false;
        document.getElementById('authScreen').style.display = 'flex';
        document.getElementById('app').classList.remove('active');
    }
});

function startApp() {
    listenSettings();
    listenChannels();
    listenFriends();
    listenUsers();
    listenMuted();
    listenMessages();
    listenDMs();
    loadTheme();
    updateStats();
    createDefaultChannels();
}

function listenSettings() {
    if (unsubscribeSettings) unsubscribeSettings();
    unsubscribeSettings = onValue(ref(db, 'settings/adminPassword'), (snap) => {
        if (snap.exists()) adminPassword = snap.val();
    });
}

window.setTheme = function(theme) {
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    if (currentUser) update(ref(db, 'users/' + currentUser.uid), { theme: theme });
    showToast("🎨 Tema: " + theme, 'success');
    document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.theme === theme));
};

function loadTheme() {
    const theme = localStorage.getItem('theme') || 'blue';
    document.body.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.theme === theme));
}

function listenChannels() {
    if (unsubscribeChannels) unsubscribeChannels();
    unsubscribeChannels = onValue(ref(db, 'channels'), (snap) => {
        allChannels = [];
        const list = document.getElementById('channelsList');
        list.innerHTML = '';
        if (!snap.exists()) { list.innerHTML = '<div class="empty-state">Henüz kanal yok</div>'; return; }
        snap.forEach(c => {
            const ch = { id: c.key, ...c.val() };
            allChannels.push(ch);
            const isAdminOnly = ch.adminOnly === true;
            const row = document.createElement('div');
            row.className = 'row-item';
            row.innerHTML = `
                <div class="row-avatar">${isAdminOnly ? '📢' : '#'}</div>
                <div class="row-info">
                    <div class="row-name">${escapeHtml(ch.name)}</div>
                    <div class="row-sub">${isAdminOnly ? '👑 Sadece admin' : '💬 Herkes'}</div>
                </div>
                <div class="row-actions">
                    <button class="mini-btn" onclick="goChannel('${escapeHtml(ch.name)}')">Gir</button>
                    ${isAdmin ? `<button class="mini-btn warning" onclick="toggleChannelAdmin('${escapeHtml(ch.name)}', ${!isAdminOnly})">${isAdminOnly ? '🔓' : '🔒'}</button>` : ''}
                    ${(isAdmin && ch.name !== 'genel' && ch.name !== 'duyuru' && ch.name !== 'sohbet') ? 
                        `<button class="mini-btn danger" onclick="deleteChannel('${escapeHtml(ch.name)}')">Sil</button>` : ''}
                </div>
            `;
            list.appendChild(row);
        });
    });
}

window.toggleChannelAdmin = async function(chName, makeAdminOnly) {
    if (!isAdmin) return;
    try {
        await update(ref(db, 'channels/' + chName), { adminOnly: makeAdminOnly });
        showToast(makeAdminOnly ? "🔒 Admin'e kilitlendi" : "🔓 Herkese açıldı", 'success');
    } catch (e) { showToast("Hata!", 'error'); }
};

window.addChannel = async function() {
    const chName = document.getElementById('newChInp').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
    if (!chName || chName.length < 2) return showToast("En az 2 karakter!", 'error');
    if (allChannels.find(c => c.name === chName)) return showToast("Bu kanal zaten var!", 'error');
    if (containsBadWord(chName)) return showToast("Bu kanal adı uygun değil!", 'error');
    try {
        await set(ref(db, 'channels/' + chName), { name: chName, createdAt: Date.now(), createdBy: currentUsername });
        document.getElementById('newChInp').value = '';
        showToast("✅ Kanal eklendi: #" + chName, 'success');
    } catch (err) { showToast("Hata: " + err.message, 'error'); }
};

window.deleteChannel = async function(chName) {
    if (!isAdmin) return;
    if (!confirm("#" + chName + " kanalını sil?")) return;
    try {
        await remove(ref(db, 'channels/' + chName));
        showToast("✅ Kanal silindi", 'success');
    } catch (err) { showToast("Hata!", 'error'); }
};

window.goChannel = function(chName) {
    currentChannel = chName;
    dmTarget = null;
    switchTab('chat', document.querySelector('.side-item[data-tab="chat"]'));
    listenMessages();
};

function listenMessages() {
    if (unsubscribeMessages) unsubscribeMessages();
    const list = document.getElementById('messagesList');
    list.innerHTML = '<div class="loading"><div class="spinner"></div>Yükleniyor...</div>';

    unsubscribeMessages = onValue(ref(db, 'messages'), (snap) => {
        list.innerHTML = '';
        const all = [];
        if (snap.exists()) snap.forEach(c => all.push({ id: c.key, ...c.val() }));

        const filtered = all.filter(m => {
            if (dmTarget) {
                return (m.sender === currentUsername && m.dmTarget === dmTarget) ||
                       (m.sender === dmTarget && m.dmTarget === currentUsername);
            }
            return m.channel === currentChannel && !m.dmTarget;
        }).sort((a, b) => a.time - b.time).slice(-200);

        if (filtered.length === 0) {
            list.innerHTML = '<div class="empty-state">💬 Henüz mesaj yok<br><small>İlk mesajı sen yaz!</small></div>';
            return;
        }

        filtered.forEach(m => {
            const isSelf = m.sender === currentUsername;
            const isAdminMsg = m.isAdmin === true;
            const card = document.createElement('div');
            card.className = 'msg-box' + (isSelf ? ' self' : '') + (isAdminMsg ? ' admin-msg' : '');

            const userDisplay = isAdminMsg
                ? `<span class="msg-user admin" onclick="showProfile('${escapeHtml(m.sender)}')"><span class="admin-crown">👑</span>${escapeHtml(m.sender)}</span>`
                : `<span class="msg-user" onclick="showProfile('${escapeHtml(m.sender)}')">${escapeHtml(m.sender)}</span>`;

            const canDelete = isAdmin || isSelf;

            card.innerHTML = `
                <div class="msg-head">
                    ${userDisplay}
                    <span class="msg-time">${formatTime(m.time)}</span>
                </div>
                <div class="msg-text">${escapeHtml(m.text)}</div>
                ${canDelete ? `<div class="msg-actions"><button class="msg-action" onclick="deleteMessage('${m.id}')">🗑</button></div>` : ''}
            `;
            list.appendChild(card);
        });
        list.scrollTop = list.scrollHeight;
    });
}

window.sendMsg = async function() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !currentUser) return;

    if (isMuted(currentUsername)) {
        const m = mutedUsers[currentUsername];
        const kalan = Math.ceil((m.until - Date.now()) / 60000);
        showToast(`🔇 Susturuldun! Kalan: ${kalan} dk`, 'error');
        return;
    }

    if (containsBadWord(text)) {
        showToast("🚫 Küfür yasak!", 'error');
        return;
    }

    const ch = allChannels.find(c => c.name === currentChannel);
    if (ch && ch.adminOnly && !isAdmin) {
        showToast("🔒 Sadece admin yazabilir!", 'error');
        return;
    }

    try {
        await push(ref(db, 'messages'), {
            sender: currentUsername, senderUid: currentUser.uid,
            text: text, channel: dmTarget ? null : currentChannel,
            dmTarget: dmTarget, time: Date.now(), isAdmin: isAdmin
        });
        input.value = '';
        updateStats();
    } catch (err) { showToast("Mesaj gönderilemedi!", 'error'); }
};

window.deleteMessage = async function(msgId) {
    if (!confirm("Bu mesajı sil?")) return;
    try {
        await remove(ref(db, 'messages/' + msgId));
        showToast("✅ Mesaj silindi", 'success');
    } catch (err) { showToast("Silinemedi!", 'error'); }
};

function listenUsers() {
    if (unsubscribeUsers) unsubscribeUsers();
    unsubscribeUsers = onValue(ref(db, 'users'), (snap) => {
        allUsers = [];
        if (snap.exists()) snap.forEach(c => allUsers.push({ uid: c.key, ...c.val() }));
    });
}

function listenMuted() {
    if (unsubscribeMuted) unsubscribeMuted();
    unsubscribeMuted = onValue(ref(db, 'muted'), (snap) => {
        mutedUsers = {};
        if (snap.exists()) snap.forEach(c => mutedUsers[c.key] = c.val());
    });
    onValue(ref(db, 'banned'), (snap) => {
        bannedUsers = {};
        if (snap.exists()) snap.forEach(c => bannedUsers[c.key] = c.val());
    });
}

window.showProfile = function(username) {
    if (username === currentUsername) { openModal('settingsModal'); return; }
    const user = allUsers.find(u => u.username === username);
    const profileBody = document.getElementById('profileBody');
    const joined = user && user.createdAt ? new Date(user.createdAt).toLocaleDateString('tr-TR') : 'Bilinmiyor';
    const isThisAdmin = (user && user.role === 'admin') || username === ADMIN_USERNAME;
    const isFriend = myFriends.some(f => f.name === username);

    let html = `
        <div class="profile-header">
            <div class="profile-avatar">${getInitials(username)}</div>
            <div class="profile-name">${escapeHtml(username)}</div>
            <div class="profile-role ${isThisAdmin ? 'admin' : ''}">${isThisAdmin ? '👑 Admin' : '👤 Kullanıcı'}</div>
        </div>
        <div class="profile-info">
            <div class="profile-info-row"><span class="setting-label">Katılma Tarihi</span><span>${joined}</span></div>
            <div class="profile-info-row"><span class="setting-label">Durum</span><span>${isMuted(username) ? '🔇 Susturulmuş' : '✅ Aktif'}</span></div>
        </div>
    `;

    if (!isAdmin) {
        if (!isFriend) {
            html += `<button class="btn" style="margin-top:8px;" onclick="addFriendByName('${escapeHtml(username)}')">👥 Arkadaş Ekle</button>`;
        } else {
            html += `<div style="text-align:center;color:var(--success);margin-top:8px;font-size:11px;">✅ Arkadaşsınız</div>`;
        }
    }

    if (isAdmin && username !== currentUsername) {
        html += `
            <button class="btn" style="margin-top:8px;background:var(--warning);color:#000;" onclick="openMuteModal('${escapeHtml(username)}')">🔇 Sustur</button>
            <button class="btn" style="margin-top:5px;background:var(--danger);" onclick="openBanModal('${escapeHtml(username)}')">🚫 Banla</button>
            <button class="btn" style="margin-top:5px;background:var(--success);color:#000;" onclick="unmuteUser('${escapeHtml(username)}')">🔊 Kaldır</button>
        `;
    }

    profileBody.innerHTML = html;
    openModal('profileModal');
};

window.addFriendByName = async function(target) {
    if (target === currentUsername) return;
    if (myFriends.find(f => f.name === target)) return showToast("Zaten arkadaşsınız!", 'error');
    try {
        await set(ref(db, 'friends/' + currentUser.uid + '/' + target), { name: target, addedAt: Date.now() });
        showToast("✅ " + target + " eklendi!", 'success');
        closeModal('profileModal');
    } catch (err) { showToast("Hata!", 'error'); }
};

window.openMuteModal = function(username) {
    if (!isAdmin) return;
    muteTarget = username;
    openModal('muteModal');
};

window.openBanModal = function(username) {
    if (!isAdmin) return;
    muteTarget = username;
    document.getElementById('muteDuration').value = '1440';
    applyBan();
};

window.applyMute = async function() {
    if (!isAdmin || !muteTarget) return;
    const mins = parseInt(document.getElementById('muteDuration').value) || 60;
    const reason = document.getElementById('muteReason').value || 'Kural ihlali';
    const until = Date.now() + (mins * 60 * 1000);
    try {
        await set(ref(db, 'muted/' + muteTarget), { until, reason, by: currentUsername });
        showToast(`🔇 ${muteTarget} ${mins} dk susturuldu`, 'success');
        closeModal('muteModal');
        closeModal('profileModal');
    } catch (e) { showToast("Hata!", 'error'); }
};

window.applyBan = async function() {
    if (!isAdmin || !muteTarget) return;
    const mins = parseInt(document.getElementById('muteDuration').value) || 1440;
    const reason = document.getElementById('muteReason').value || 'Kural ihlali';
    const until = Date.now() + (mins * 60 * 1000);
    try {
        await set(ref(db, 'banned/' + muteTarget), { until, reason, by: currentUsername });
        showToast(`🚫 ${muteTarget} ${mins} dk banlandı`, 'success');
        closeModal('muteModal');
        closeModal('profileModal');
    } catch (e) { showToast("Hata!", 'error'); }
};

window.unmuteUser = async function(username) {
    if (!isAdmin) return;
    try {
        await remove(ref(db, 'muted/' + username));
        await remove(ref(db, 'banned/' + username));
        showToast("✅ Kaldırıldı", 'success');
        closeModal('profileModal');
    } catch (e) { showToast("Hata!", 'error'); }
};

function listenFriends() {
    if (unsubscribeFriends) unsubscribeFriends();
    unsubscribeFriends = onValue(ref(db, 'friends/' + currentUser.uid), (snap) => {
        myFriends = [];
        const list = document.getElementById('friendsList');
        list.innerHTML = '';
        if (snap.exists()) snap.forEach(c => myFriends.push({ id: c.key, ...c.val() }));

        document.getElementById('settingsFriendCount').innerText = myFriends.length;
        document.getElementById('friendBadge').style.display = myFriends.length > 0 ? 'flex' : 'none';
        document.getElementById('friendBadge').innerText = myFriends.length;

        if (myFriends.length === 0) {
            list.innerHTML = '<div class="empty-state">👥 Henüz arkadaşın yok<br><small>Yukarıdan kullanıcı adı ile ekle</small></div>';
            return;
        }

        myFriends.forEach(f => {
            const row = document.createElement('div');
            row.className = 'row-item';
            row.innerHTML = `
                <div class="row-avatar" onclick="showProfile('${escapeHtml(f.name)}')">${getInitials(f.name)}</div>
                <div class="row-info" onclick="showProfile('${escapeHtml(f.name)}')">
                    <div class="row-name">${escapeHtml(f.name)}</div>
                    <div class="row-sub">${f.name === ADMIN_USERNAME ? '👑 Admin' : 'Arkadaş'}</div>
                </div>
                <div class="row-actions">
                    <button class="mini-btn" onclick="openDM('${escapeHtml(f.name)}')">✉ DM</button>
                    <button class="mini-btn danger" onclick="removeFriend('${escapeHtml(f.name)}')">Sil</button>
                </div>
            `;
            list.appendChild(row);
        });
    });
}

window.addFriend = async function() {
    const target = document.getElementById('friendInp').value.trim();
    if (!target) return showToast("Kullanıcı adı gerekli!", 'error');
    if (target === currentUsername) return showToast("Kendini ekleyemezsin!", 'error');
    if (myFriends.find(f => f.name === target)) return showToast("Zaten arkadaşsınız!", 'error');
    try {
        const usersSnap = await get(ref(db, 'users'));
        let found = false;
        if (usersSnap.exists()) usersSnap.forEach(c => { if (c.val().username === target) found = true; });
        if (!found) return showToast("Kullanıcı yok!", 'error');
        await set(ref(db, 'friends/' + currentUser.uid + '/' + target), { name: target, addedAt: Date.now() });
        document.getElementById('friendInp').value = '';
        showToast("✅ " + target + " eklendi!", 'success');
    } catch (err) { showToast("Hata!", 'error'); }
};

window.removeFriend = async function(name) {
    if (!confirm(name + " kişisini sil?")) return;
    try {
        await remove(ref(db, 'friends/' + currentUser.uid + '/' + name));
        showToast("✅ Silindi", 'success');
    } catch (err) { showToast("Silinemedi!", 'error'); }
};

window.openDM = function(target) {
    dmTarget = target;
    currentChannel = null;
    switchTab('chat', document.querySelector('.side-item[data-tab="chat"]'));
    listenMessages();
};

function listenDMs() {
    if (unsubscribeDMs) unsubscribeDMs();
    unsubscribeDMs = onValue(ref(db, 'messages'), (snap) => {
        const list = document.getElementById('dmsList');
        list.innerHTML = '';
        const partners = new Set();
        if (snap.exists()) snap.forEach(c => {
            const m = c.val();
            if (!m.dmTarget) return;
            if (m.sender === currentUsername) partners.add(m.dmTarget);
            else if (m.dmTarget === currentUsername) partners.add(m.sender);
        });
        if (partners.size === 0) {
            list.innerHTML = '<div class="empty-state">✉️ Henüz özel mesajın yok<br><small>Kişiler sekmesinden DM başlat</small></div>';
            return;
        }
        partners.forEach(p => {
            const row = document.createElement('div');
            row.className = 'row-item';
            row.innerHTML = `
                <div class="row-avatar">${getInitials(p)}</div>
                <div class="row-info">
                    <div class="row-name">${escapeHtml(p)}</div>
                    <div class="row-sub">Özel sohbet</div>
                </div>
                <div class="row-actions">
                    <button class="mini-btn" onclick="openDM('${escapeHtml(p)}')">Aç</button>
                </div>
            `;
            list.appendChild(row);
        });
    });
}

window.switchTab = function(tab, el) {
    document.querySelectorAll('.side-item').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    if (el) el.classList.add('active');
    const title = document.getElementById('panelTitle');
    const sub = document.getElementById('panelSub');
    if (tab === 'chat') {
        document.getElementById('chatPanel').classList.add('active');
        title.innerText = dmTarget ? "✉ " + dmTarget : "#" + currentChannel;
        sub.innerText = dmTarget ? "Özel mesaj" : (currentChannel === 'duyuru' ? "📢 Duyuru" : "Sohbet");
    } else if (tab === 'channels') {
        document.getElementById('channelsPanel').classList.add('active');
        title.innerText = "📢 Kanallar"; sub.innerText = allChannels.length + " kanal";
    } else if (tab === 'friends') {
        document.getElementById('friendsPanel').classList.add('active');
        title.innerText = "👥 Kişiler"; sub.innerText = myFriends.length + " arkadaş";
    } else if (tab === 'dms') {
        document.getElementById('dmsPanel').classList.add('active');
        title.innerText = "✉️ Mesajlar"; sub.innerText = "Özel konuşmalar";
    }
};

async function createDefaultChannels() {
    try {
        const snap = await get(ref(db, 'channels'));
        if (!snap.exists()) {
            await set(ref(db, 'channels/genel'), { name: 'genel', createdAt: Date.now(), createdBy: 'system' });
            await set(ref(db, 'channels/duyuru'), { name: 'duyuru', createdAt: Date.now(), createdBy: 'system', adminOnly: true });
            await set(ref(db, 'channels/sohbet'), { name: 'sohbet', createdAt: Date.now(), createdBy: 'system' });
        }
    } catch (e) {}
}

async function updateStats() {
    try {
        const snap = await get(ref(db, 'messages'));
        let myMsgs = 0;
        if (snap.exists()) snap.forEach(c => { if (c.val().sender === currentUsername) myMsgs++; });
        document.getElementById('settingsMsgCount').innerText = myMsgs;
    } catch (e) {}
}

window.openModal = function(id) { document.getElementById(id).classList.add('active'); };
window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };

document.querySelectorAll('.modal').forEach(m => {
    m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('active'); });
});

document.getElementById('authP').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleAuth();
});
</script>
</body>
